paths:
  /api/deliveries:
    get:
      tags:
      - Deliveries
      summary: Listar entregas
      description: Devuelve todas las entregas, con el pedido y los datos básicos del repartidor.
      responses:
        '200':
          description: Lista de entregas
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    payload:
                      type: array
                      items:
                        $ref: '#/components/schemas/DeliveryDetail'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Deliveries
      summary: Crear entrega
      description: Crea una entrega para un pedido existente. El repartidor es opcional; si se envía, tiene que existir y tener rol driver.
      requestBody:
        required: true
        description: Datos de la entrega
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCreate'
            example:
              order: 671a2b3c4d5e6f7890123456
              driver: 671a2b3c4d5e6f7890123456
              status: assigned
              priority: normal
      responses:
        '201':
          description: Entrega creada
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    payload:
                      $ref: '#/components/schemas/Delivery'
        '400':
          description: Cuerpo inválido, estado o prioridad no permitidos, el usuario indicado no es repartidor o algún id no tiene formato válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_JSON:
                  summary: INVALID_JSON
                  value:
                    status: error
                    code: INVALID_JSON
                    message: El cuerpo de la petición no es un JSON válido
                    details: []
                INVALID_DELIVERY_STATUS:
                  summary: INVALID_DELIVERY_STATUS
                  value:
                    status: error
                    code: INVALID_DELIVERY_STATUS
                    message: El estado de la entrega no es válido
                    details:
                    - field: status
                      received: volando
                      allowed:
                      - pending
                      - assigned
                      - in_transit
                      - delivered
                INVALID_PRIORITY:
                  summary: INVALID_PRIORITY
                  value:
                    status: error
                    code: INVALID_PRIORITY
                    message: La prioridad indicada no es válida
                    details:
                    - field: priority
                      received: urgentisima
                      allowed:
                      - low
                      - normal
                      - high
                USER_NOT_DRIVER:
                  summary: USER_NOT_DRIVER
                  value:
                    status: error
                    code: USER_NOT_DRIVER
                    message: El usuario indicado no tiene rol de repartidor
                    details: []
                INVALID_ID:
                  summary: INVALID_ID
                  value:
                    status: error
                    code: INVALID_ID
                    message: El id proporcionado no es válido
                    details:
                    - field: _id
                      received: abc
        '404':
          description: El pedido o el repartidor indicado no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ORDER_NOT_FOUND:
                  summary: ORDER_NOT_FOUND
                  value:
                    status: error
                    code: ORDER_NOT_FOUND
                    message: Pedido no encontrado
                    details: []
                DRIVER_NOT_FOUND:
                  summary: DRIVER_NOT_FOUND
                  value:
                    status: error
                    code: DRIVER_NOT_FOUND
                    message: El repartidor especificado no existe
                    details: []
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/deliveries/{id}:
    get:
      tags:
      - Deliveries
      summary: Obtener entrega por id
      description: Devuelve una entrega con el pedido y el repartidor completados.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Entrega encontrada
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    payload:
                      $ref: '#/components/schemas/DeliveryDetail'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/DeliveryNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Deliveries
      summary: Actualizar entrega
      description: Modifica los campos enviados de una entrega (por ejemplo su estado). Devuelve la entrega actualizada.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        description: Campos a modificar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryUpdate'
            example:
              status: in_transit
      responses:
        '200':
          description: Entrega actualizada
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    payload:
                      $ref: '#/components/schemas/Delivery'
        '400':
          description: Id inválido, cuerpo inválido, o estado o prioridad no permitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_ID:
                  summary: INVALID_ID
                  value:
                    status: error
                    code: INVALID_ID
                    message: El id proporcionado no es válido
                    details:
                    - field: _id
                      received: abc
                INVALID_JSON:
                  summary: INVALID_JSON
                  value:
                    status: error
                    code: INVALID_JSON
                    message: El cuerpo de la petición no es un JSON válido
                    details: []
                INVALID_DELIVERY_STATUS:
                  summary: INVALID_DELIVERY_STATUS
                  value:
                    status: error
                    code: INVALID_DELIVERY_STATUS
                    message: El estado de la entrega no es válido
                    details:
                    - field: status
                      received: volando
                      allowed:
                      - pending
                      - assigned
                      - in_transit
                      - delivered
                INVALID_PRIORITY:
                  summary: INVALID_PRIORITY
                  value:
                    status: error
                    code: INVALID_PRIORITY
                    message: La prioridad indicada no es válida
                    details:
                    - field: priority
                      received: urgentisima
                      allowed:
                      - low
                      - normal
                      - high
        '404':
          $ref: '#/components/responses/DeliveryNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Deliveries
      summary: Eliminar entrega
      description: Elimina una entrega.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Entrega eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                status: success
                message: Entrega eliminada
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/DeliveryNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/deliveries/{id}/proofs:
    post:
      tags:
      - Deliveries
      summary: Cargar un comprobante de entrega
      description: |
        Sube un comprobante (foto o PDF de la entrega) y lo asocia a la entrega.
        El archivo se guarda en el servidor (`uploads/proofs`) y en la base de datos se registran solo sus metadatos.

        - **Content-Type:** `multipart/form-data`
        - **Campo del archivo:** `proof` (obligatorio, un solo archivo). Si se envía con otro nombre responde `UNEXPECTED_FILE_FIELD`.
        - **Tipo de documento:** siempre `delivery_proof` (no hace falta enviarlo).
        - **Archivos aceptados:** PDF, JPG, PNG y WEBP, de hasta 5 MB.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - proof
              properties:
                proof:
                  type: string
                  format: binary
                  description: Comprobante a subir (PDF, JPG, PNG o WEBP, máximo 5 MB)
      responses:
        '201':
          description: Comprobante cargado. Devuelve la entrega actualizada, con el nuevo comprobante al final de `proofs`.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    message:
                      type: string
                      example: Comprobante cargado correctamente
                    payload:
                      $ref: '#/components/schemas/DeliveryDetail'
        '400':
          description: 'Falta el archivo, el tipo de archivo no es válido, el archivo llegó en otro campo, el id no tiene formato válido o el multipart está mal formado (UPLOAD_ERROR)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FILE_REQUIRED:
                  summary: FILE_REQUIRED
                  value:
                    status: error
                    code: FILE_REQUIRED
                    message: Es obligatorio enviar un archivo
                    details:
                    - field: proof
                INVALID_FILE_TYPE:
                  summary: INVALID_FILE_TYPE
                  value:
                    status: error
                    code: INVALID_FILE_TYPE
                    message: El tipo de archivo no está permitido
                    details:
                    - field: proof
                      received: text/plain
                      allowed:
                      - application/pdf
                      - image/jpeg
                      - image/png
                      - image/webp
                UNEXPECTED_FILE_FIELD:
                  summary: UNEXPECTED_FILE_FIELD
                  value:
                    status: error
                    code: UNEXPECTED_FILE_FIELD
                    message: El archivo se envió en un campo que no corresponde
                    details:
                    - field: archivo
                      expected: proof
                INVALID_ID:
                  summary: INVALID_ID
                  value:
                    status: error
                    code: INVALID_ID
                    message: El id proporcionado no es válido
                    details:
                    - field: _id
                      received: abc
        '404':
          $ref: '#/components/responses/DeliveryNotFound'
        '413':
          description: El comprobante supera el tamaño máximo permitido (5 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                code: INVALID_FILE_SIZE
                message: El archivo supera el tamaño máximo permitido
                details:
                - field: proof
                  maxSizeBytes: 5242880
                  maxSizeMB: 5
        '500':
          $ref: '#/components/responses/FileSaveError'
